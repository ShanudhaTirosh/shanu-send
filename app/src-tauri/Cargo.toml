[package]
name = "shanusend"
version = "0.1.0"
description = "ShanuSend — lightweight, LocalSend-compatible file transfer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.0.3", features = [] }

[dependencies]
shanusend-core = { path = "../../core" }
tauri = { version = "=2.0.6", features = [] }
tauri-plugin-dialog = "=2.0.1"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.128"
tokio = { version = "=1.38.1", features = ["full"] }
uuid = { version = "=1.9.1", features = ["v4"] }
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
dirs = "5"

# NOTE: same rustc-1.75-sandbox pins as core/Cargo.toml — see the comment
# there. On a real machine with current Rust these can go back to bare
# `"2"` / `"1"` ranges; Tauri 2 itself requires Rust >= 1.77 regardless.

[features]
custom-protocol = ["tauri/custom-protocol"]
