[package]
name = "shanusend"
version = "0.1.0"
description = "ShanuSend — lightweight, LocalSend-compatible file transfer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shanusend-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
zip = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "stream"] }
futures-util = "0.3"


# NOTE: previously pinned to exact mid-2024 versions to work around a
# development sandbox stuck on rustc 1.75. That pinning is what caused a
# real CI failure: `tauri-build = "=2.0.3"` was left unpinned relative to
# its sibling crate `tauri-utils`, which resolved independently to a much
# newer `2.9.3` and broke on an internal API tauri-build 2.0.3 called with
# the old signature (`save_global_api_scripts_paths`, `read_from`,
# `external_binaries`). The fix is exactly this: don't hand-pin individual
# crates from a fast-moving, co-versioned family (tauri/tauri-build/
# tauri-utils/tauri-plugin-*) — let Cargo resolve them together. Tauri 2
# requires Rust >= 1.77 regardless of any of this.

[features]
custom-protocol = ["tauri/custom-protocol"]
