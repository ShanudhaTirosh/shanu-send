[package]
name = "shanusend-core"
version = "0.1.0"
edition = "2021"
description = "Protocol-compatible discovery, transfer, and crypto core for ShanuSend (LocalSend protocol v2.1)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.9", features = ["v4"] }
socket2 = "0.5"
rand = "0.8"
sha2 = "0.10"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls-pemfile = "2.1"
aws-lc-sys = { version = "0.43", features = ["prebuilt-nasm"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "stream"] }

[features]
default = ["tls"]
tls = ["dep:axum-server"]

[dev-dependencies]
tokio-test = "0.4"
