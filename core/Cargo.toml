[package]
name = "shanusend-core"
version = "0.1.0"
edition = "2021"
description = "Protocol-compatible discovery, transfer, and crypto core for ShanuSend (LocalSend protocol v2.1)"

[dependencies]
tokio = { version = "=1.38.1", features = ["full"] }
axum = { version = "=0.7.5", features = ["multipart"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.128"
uuid = { version = "=1.9.1", features = ["v4"] }
socket2 = "=0.5.7"
rand = "=0.8.5"
sha2 = "=0.10.8"
rcgen = "=0.13.1"
tokio-rustls = "=0.26.0"
rustls = { version = "=0.23.10", features = ["ring"] }
axum-server = { version = "=0.7.3", features = ["tls-rustls"], optional = true }
rustls-pemfile = "=2.1.2"
thiserror = "=1.0.61"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
futures = "=0.3.30"
reqwest = { version = "=0.12.5", default-features = false, features = ["json", "default-tls"] }

[features]
default = []
# Real HTTPS termination (Phase 3). Off by default: this sandbox's rustc 1.75
# forces dependency version pins (see comments above) that create a real
# version-skew incompatibility between axum-server and hyper-util which does
# NOT occur on an unconstrained modern toolchain. Build with
# `cargo build --features tls` on a real machine (rustup, current stable) to
# get and verify this path — the code itself (server::serve_tls) is written
# and reviewed, just not compilable in this particular sandbox.
tls = ["dep:axum-server", "reqwest/rustls-tls-manual-roots"]

# NOTE (sandbox constraint): pinned to mid-2024 releases because this
# container only has rustc 1.75 available via apt, and much newer point
# releases of transitive deps (time, getrandom, icu_*) require the
# edition2024 Cargo feature that 1.75 doesn't support. On a real dev
# machine (Tauri itself requires Rust >= 1.77 anyway) these pins can be
# relaxed back to bare `"1"`/`"0.x"` ranges — nothing above is pinned for
# correctness reasons, only for this sandbox's outdated toolchain.

[dev-dependencies]
tokio-test = "0.4"
