name: Cross-Platform CI/CD Build Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-core-test:
    name: Rust Engine Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Cargo Tests
        run: cargo test --manifest-path core/Cargo.toml --all-features

  desktop-build:
    name: Desktop Tauri Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Desktop Dependencies
        run: |
          cd app
          npm ci
      - name: Build Tauri Desktop Executable
        run: |
          cd app
          npm run tauri build -- --no-bundle

  mobile-flutter-build:
    name: Mobile Flutter Build (Android & iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get
      - name: Flutter Unit Tests
        run: |
          cd flutter_app
          flutter test
      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --release
      - name: Build iOS App (No Sign)
        run: |
          cd flutter_app
          flutter build ios --release --no-codesign
