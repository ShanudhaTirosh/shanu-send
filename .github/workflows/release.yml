name: Release

# Builds real, distributable installers on every OS natively (no
# cross-compiling — simpler and more reliable) and attaches them to a
# GitHub Release.
#
# Triggers:
#   - push a tag like `v0.2.0` -> builds + publishes a release automatically
#   - manual dispatch -> same, but you can pick draft/prerelease at run time
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # Intel Mac
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Debian/Ubuntu (.deb, .AppImage, .rpm)
          - platform: ubuntu-22.04
            args: ''
          # Windows (.msi, .exe)
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only macOS needs explicit targets, for the universal/Silicon split above.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/src-tauri

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config \
            file

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If/when code signing is set up, these go here as repo secrets:
          # TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # (Tauri updater signing) and, for macOS notarization,
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID. Until then, builds are
          # unsigned — fine for personal/internal use, but macOS/Windows will
          # show an "unknown publisher" warning on first launch.
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'ShanuSend v__VERSION__'
          releaseBody: |
            See the assets below to download and install for your platform.

            | Platform | File |
            |---|---|
            | Windows | `.msi` or `.exe` |
            | macOS (Apple Silicon) | `aarch64` `.dmg` |
            | macOS (Intel) | `x64` `.dmg` |
            | Linux | `.deb`, `.AppImage`, or `.rpm` |
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}
